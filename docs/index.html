<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skippy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div>
          <h1>Skippy</h1>
          <div id="location" class="muted small">South Devon UK</div>
        </div>
        <a class="btn" href="./settings.html">Settings</a>
      </div>

      <div class="spacer"></div>

      <div id="bestCard" class="card">
        <div class="muted small">Best day this week</div>
        <div class="spacer"></div>
        <div class="muted small">Loading...</div>
      </div>

      <div class="spacer"></div>

      <div class="muted small">7-day forecast</div>
      <div class="spacer"></div>

      <div id="days" class="list"></div>

      <div class="spacer"></div>
      <div class="muted small" id="footerNote"></div>
    </div>

    <div class="footerbar">
      <div class="row">
        <a class="nav-item active" href="./about.html">About</a>
        <a class="nav-item" href="./location.html">Change location</a>
      </div>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
