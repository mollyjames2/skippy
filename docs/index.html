<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skippy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="splash" class="splash">
      <img src="./assets/skippy.png" alt="Skippy" class="splash-logo" />
    </div>

    <div id="appRoot">
      <div class="container">
      
      
        <div class="topbar">
          <div>
            <img src="./assets/logo_horz.png" alt="Skippy" class="logo-horz" />
            <!-- <div id="location" class="muted small">South Devon UK</div> -->
          </div>
        
          <div style="flex:1"></div>
        
          <button id="webcamBtn" class="btn" aria-label="Webcam">
            <span style="display:inline-flex; align-items:center;">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <path d="M4 7h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"
                      fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M16 10l6-3v10l-6-3v-4z"
                      fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
        
          <button id="settingsBtn" class="btn">Settings</button>
        </div>

    

        <div class="spacer"></div>
          <div id="hoursModeCard" class="card hours-mode-card" role="button" aria-label="Daily hours mode (tap to change)">
          <div class="row">
            <div class="muted small">Daily hours mode</div>
            <div id="hoursModePill" class="pill">—</div>
          </div>
        </div>
        
        <div class="spacer"></div>


        <button id="locationBar" class="location-bar" type="button" aria-label="Set location">
          <div class="location-left">
            <!-- SVG pin icon (reliable across iOS/PWA, avoids emoji rendering issues) -->
            <svg
              class="location-pin"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M12 22s7-5.3 7-12a7 7 0 1 0-14 0c0 6.7 7 12 7 12z"
                fill="currentColor"
              ></path>
              <circle cx="12" cy="10" r="2.5" fill="rgba(255,255,255,0.85)"></circle>
            </svg>

            <span id="locationLabel" class="location-label">Set location</span>
          </div>
        </button>

        <div class="spacer"></div>

        <!-- NEW: Today tides card -->
        <div id="tideCard" class="card">
          <div class="muted small">Today's tides</div>
          <div class="spacer"></div>
          <div class="muted small">Loading...</div>
        </div>

        <div class="spacer"></div>

        <div id="bestCard" class="card">
          <div class="muted small">Best day this week</div>
          <div class="spacer"></div>
          <div class="muted small">Loading...</div>
        </div>

        <div class="spacer"></div>

        <div id="forecastLabel" class="muted small">weekly forecast</div>
        <div class="spacer"></div>

        <div id="days" class="list"></div>

        <div class="spacer"></div>
        <div class="muted small" id="footerNote"></div>
      </div>

      <div class="footerbar">
        <div class="row">
          <!-- (optional footer nav later) -->
        </div>
      </div>
    </div>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
