<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skippy - Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <a class="btn" href="./index.html">Back</a>
        <h1>Settings</h1>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Defaults</h2>
        <div class="spacer"></div>

        <div class="muted small">Home area label (display only for now)</div>
        <div class="spacer"></div>
        <input id="homeLabel" class="btn" style="width:100%;" placeholder="South West UK" />

        <div class="spacer"></div>
        <div class="muted small">API base URL (Cloudflare Worker)</div>
        <div class="spacer"></div>
        <input id="apiBase" class="btn" style="width:100%;" placeholder="https://YOUR-WORKER.workers.dev" />

        <div class="spacer"></div>
        <button id="saveBtn" class="btn" style="width:100%;">Save</button>

        <div class="spacer"></div>
        <div id="status" class="muted small"></div>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Next up</h2>
        <div class="spacer"></div>
        <div class="muted small">
          We'll add tide access rules per user (e.g., block X hours around HW/LW), and real data sources.
        </div>
      </div>
    </div>

    <script src="./settings.js"></script>
  </body>
</html>
