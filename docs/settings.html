<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skippy - Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <img src="./assets/logo_horz.png" alt="Skippy" class="logo-horz" />
        <div style="flex:1"></div>
        <button id="homeBtn" class="btn">Home</button>
      </div>

      <!-- Boating score card -->
      <div class="card">
        <div style="font-weight:800; margin-bottom:6px;">Boating Score</div>
        <div class="muted small">
          Choose which hours Skippy averages when calculating the daily Boating Score.
        </div>

        <div class="spacer"></div>

        <div class="row" style="align-items:flex-start;">
          <div class="muted small" style="flex:1;">
            Daily score uses
          </div>

          <div class="segmented" id="dailyScoreMode" aria-label="Daily score hours">
            <button class="segbtn" data-mode="all" type="button">All hours</button>
            <button class="segbtn" data-mode="daylight" type="button">Daylight</button>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="muted small">
          Daylight uses local sunrise/sunset and rounds to full hours.
        </div>
      </div>

      <div class="spacer"></div>

      <!-- About card -->
      <div class="card">
        <div style="font-weight:800; margin-bottom:6px;">About</div>
        <div class="muted small">
          Learn what Skippy does and how the ratings work.
        </div>

        <div class="spacer"></div>

        <button id="aboutBtn" class="btn">About Skippy</button>
      </div>

      <div class="footer muted small" id="footerNote"></div>
    </div>

    <script src="./settings.js"></script>
  </body>
</html>
