<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skippy - Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <img src="./assets/skippy.png" alt="Skippy" class="logo-horz" />
        <div style="flex:1"></div>
        <button id="homeBtn" class="btn">Home</button>
      </div>

      <!-- Location card -->
      <div class="card">
        <div style="font-weight:800; margin-bottom:6px;">Location</div>

        <div class="muted small" id="currentLocationText">
          Current location: (loading...)
        </div>

        <div class="spacer"></div>

        <button id="changeLocationBtn" class="btn">Change location</button>
      </div>

      <div class="spacer"></div>

      <!-- About card -->
      <div class="card">
        <div style="font-weight:800; margin-bottom:6px;">About</div>
        <div class="muted small">
          Learn what Skippy does and how the ratings work.
        </div>

        <div class="spacer"></div>

        <button id="aboutBtn" class="btn">About Skippy</button>
      </div>

      <div class="footer muted small" id="footerNote"></div>
    </div>

    <script src="./settings.js"></script>
  </body>
</html>
