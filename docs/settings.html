<!-- docs/settings.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings • Skippy</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header class="topbar">
      <a class="topbar__back" href="./index.html" aria-label="Back">?</a>
      <div class="topbar__title">Settings</div>
      <div class="topbar__spacer"></div>
    </header>

    <main class="page">
      <!-- Existing settings sections (if any) remain unchanged above/below.
           This file adds a Boating Score section without breaking existing markup. -->

      <section class="card">
        <h2 class="card__title">Boating score</h2>

        <!-- Existing: Daily score hours mode -->
        <div class="setting">
          <div class="setting__label">
            <div class="setting__name">Daily score hours</div>
            <div class="setting__hint">Use all hours or only daylight hours for daily scores</div>
          </div>

          <div
            id="dailyScoreHoursMode"
            class="segmented"
            role="group"
            aria-label="Daily score hours"
          >
            <button type="button" class="segmented__btn" data-value="all" aria-pressed="false">
              All hours
            </button>
            <button
              type="button"
              class="segmented__btn"
              data-value="daylight"
              aria-pressed="false"
            >
              Daylight
            </button>
          </div>
        </div>

        <hr class="divider" />

        <!-- NEW: Scoring profile -->
        <div class="setting">
          <div class="setting__label">
            <div class="setting__name">Scoring style</div>
            <div class="setting__hint">Adjust how cautious the boating score is</div>
          </div>

          <div id="scoreProfile" class="segmented" role="group" aria-label="Scoring style">
            <button type="button" class="segmented__btn" data-value="safety" aria-pressed="false">
              Safety
            </button>
            <button
              type="button"
              class="segmented__btn"
              data-value="standard"
              aria-pressed="false"
            >
              Standard
            </button>
            <button
              type="button"
              class="segmented__btn"
              data-value="opportunity"
              aria-pressed="false"
            >
              Opportunity
            </button>
          </div>
        </div>

        <!-- NEW: Include temperature -->
        <div class="setting">
          <div class="setting__label">
            <div class="setting__name">Include temperature</div>
            <div class="setting__hint">Optionally factor cold air/sea into the score</div>
          </div>

          <div
            id="scoreIncludeTemp"
            class="segmented"
            role="group"
            aria-label="Include temperature"
          >
            <button type="button" class="segmented__btn" data-value="off" aria-pressed="false">
              Off
            </button>
            <button type="button" class="segmented__btn" data-value="on" aria-pressed="false">
              On
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./settings.js"></script>
  </body>
</html>
