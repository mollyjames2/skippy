<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skippy - Day</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <a class="btn" href="./index.html">Back</a>
        <div style="text-align: right">
          <div class="muted small" id="location">South Devon UK</div>
          <div style="font-weight: 800" id="title">Loading...</div>
        </div>
      </div>

      <div class="spacer"></div>

      <div id="summary" class="card">
        <div class="muted small">Loading...</div>
      </div>

      <div class="spacer"></div>

      <div id="sunPill" class="card"></div>

      <div class="spacer"></div>


      <div class="card">
        <h2>Tides</h2>
        <div class="spacer"></div>
        <div class="list" id="tides"></div>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Recommended windows</h2>
        <div class="spacer"></div>
        <div class="list" id="windows"></div>
        <div class="spacer"></div>
        <div class="muted small">
          Tide access rules will come from Settings (we will wire this in next).
        </div>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <div class="row" style="align-items:flex-start;">
          <h2 style="margin:0;">Hourly conditions</h2>

          <div class="segmented" id="hoursToggle" aria-label="Hourly filter">
            <button class="segbtn" data-mode="all" type="button">All hours</button>
            <button class="segbtn" data-mode="daylight" type="button">Daylight</button>
          </div>
        </div>

        <div class="spacer"></div>

        <!-- Column header + rows are rendered into this -->
        <div class="list" id="hours"></div>
      </div>

      <div class="spacer"></div>
    </div>

    <script src="./config.js"></script>
    <script type="module" src="./day.js"></script>
  </body>
</html>
