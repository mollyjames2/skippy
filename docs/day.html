<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skippy - Day</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <a class="btn" href="./index.html">Back</a>
        <div style="text-align:right;">
          <div class="muted small" id="location">South West UK</div>
          <div style="font-weight:800;" id="title">Loading...</div>
        </div>
      </div>

      <div class="spacer"></div>

      <div id="summary" class="card">
        <div class="muted small">Loading...</div>
      </div>

      <div class="spacer"></div>

      <div class="tilegrid" id="tiles"></div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Tides</h2>
        <div class="spacer"></div>
        <div class="list" id="tides"></div>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Recommended windows</h2>
        <div class="spacer"></div>
        <div class="list" id="windows"></div>
        <div class="spacer"></div>
        <div class="muted small">
          Tide access rules will come from Settings (we will wire this in next).
        </div>
      </div>

      <div class="spacer"></div>

      <div class="card">
        <h2>Hourly conditions</h2>
        <div class="spacer"></div>
        <div class="list" id="hours"></div>
      </div>

      <div class="spacer"></div>
    </div>

    <script src="./day.js"></script>
  </body>
</html>
